<div class="container">

  <h2>🚗 Check-out Vehículo</h2>

  <!-- INFO DEL INGRESO -->
  <div *ngIf="entry">

    <p><strong>Placa:</strong> {{ entry.vehicle?.plate }}</p>
    <p><strong>Entrada:</strong> {{ entry.entry_time }}</p>
    <p><strong>Notas:</strong> {{ entry.notes }}</p>

  </div>

  <!-- BOTÓN CHECKOUT -->
  <button (click)="checkOut()" [disabled]="loading">

    <span *ngIf="!loading">Registrar salida</span>
    <span *ngIf="loading">Procesando...</span>

  </button>

  <!-- MENSAJE -->
  <p *ngIf="successMessage">
    {{ successMessage }}
  </p>

</div>
