<div class="login-container">

  <div class="login-box">

    <h2>Parking Lot Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- EMAIL -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Ingrese su email" />

        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Email inválido
        </small>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Ingrese su contraseña" />

        <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password mínimo 4 caracteres
        </small>
      </div>

      <!-- BUTTON -->
      <button type="submit" [disabled]="loginForm.invalid">
        Ingresar
      </button>

    </form>

  </div>

</div>
